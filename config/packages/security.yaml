security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        admin_user_provider:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: admin_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_dashboard
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login
                enable_csrf: true
            # 5 échecs / 15 min par identifiant + IP ; compteurs en base (voir rate_limiter.yaml)
            login_throttling:
                limiter: app.login_rate_limiter
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                default_target_path: admin_dashboard
                failure_handler: App\Security\TwoFactorFailureHandler
                enable_csrf: true
            # Pas de remember_me : il contournerait la double authentification.

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/deconnexion$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/code(/|$), roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
