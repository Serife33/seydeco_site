# Originaux hors de public/ ; seules les versions redimensionnées sont servies (public/media/cache).
liip_imagine:
    driver: gd
    loaders:
        default:
            filesystem:
                data_root: '%app.upload_dir%'
    # auto_rotate : les photos de téléphone portent leur sens dans l'EXIF, appliqué avant le recadrage
    filter_sets:
        # Miniature de la liste et du formulaire admin (48 px affichés, 96 px pour les écrans haute densité)
        admin_thumb:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [96, 96], mode: outbound }
        # Carte produit du catalogue public (photo 4:5, ~240 px affichés, 480 px pour les écrans haute densité)
        catalog_card:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [480, 600], mode: outbound }
        # Fiche produit : image principale 1:1 (srcset 400/800), vignettes, plein écran (proportions conservées)
        product_400:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [400, 400], mode: outbound }
        product_800:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [800, 800], mode: outbound }
        product_thumb:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [240, 240], mode: outbound }
        product_full:
            format: '%app.image_format%'
            quality: 82
            filters:
                auto_rotate: ~
                thumbnail: { size: [1600, 1600], mode: inset }
        # Photo facultative d'une page de contenu (À propos…) et son aperçu de partage (3:2)
        page_photo:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [1200, 800], mode: outbound }
        # Haut de l'accueil (story 2.9) : une photo pleine largeur 16:9, ou deux côte à côte 4:3 (srcset)
        hero_800:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [800, 450], mode: outbound }
        hero_1600:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [1600, 900], mode: outbound }
        hero_half_600:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [600, 450], mode: outbound }
        hero_half_1200:
            format: '%app.image_format%'
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [1200, 900], mode: outbound }
