name: CI

on:
  push:
    tags-ignore: ['release-*']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # En env test, doctrine.yaml ajoute le suffixe _test : base app_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app?serverVersion=10.11.2-MariaDB&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql
          ini-values: date.timezone=Europe/Paris
          coverage: none

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Base de test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Tests PHPUnit
        run: php bin/phpunit

      - name: Audit de sécurité des dépendances
        run: composer audit

      - name: Vérifications de build prod
        run: |
          composer validate --strict
          php bin/console lint:yaml config
          php bin/console lint:twig templates
          php bin/console lint:container
          APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear
          APP_ENV=prod php bin/console asset-map:compile

      - name: Shellcheck deploy.sh
        run: shellcheck deploy.sh
